<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050706">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.webmanifest">

<title>Путь йога — прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Tiro+Devanagari+Sanskrit&display=swap" rel="stylesheet">
<style>
:root{--bg:#050706;--ink:#e6dfcf;--dim:#8d8676;--amber:#e8b86a;--amber2:rgba(232,184,106,.38);--line:rgba(230,223,207,.16)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
.hidden{display:none!important}
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 22px;background:linear-gradient(#050706f2,#05070600);font-size:11px;letter-spacing:.03em;pointer-events:auto}
.hud button{background:rgba(5,7,6,.7);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:13px;padding:10px 13px;min-height:42px;border-radius:10px;cursor:pointer}
.hud .l{display:flex;gap:6px}
#btnBack{color:var(--amber);border-color:rgba(232,184,106,.5)}
#btnBack.hidden{display:none}
#btnTilt.off{color:#d98a6a;border-color:rgba(217,138,106,.5)}
.hud .r{display:flex;gap:6px}
.stage{color:var(--amber)}
.panel{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;padding:22px 12px calc(env(safe-area-inset-bottom) + 12px);pointer-events:auto}
.card{border:1px solid var(--amber2);background:rgba(7,9,8,.94);padding:16px;border-radius:10px;max-height:72vh;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;box-shadow:0 0 40px #000}
.who{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:8px}
.tag{margin-left:6px;color:var(--dim);text-transform:none;letter-spacing:.02em}
.txt{font-size:15px;line-height:1.55;min-height:3.1em}
.tap{margin-top:10px;font-size:11px;color:var(--dim);text-align:right}
.btn{display:block;width:100%;margin-top:8px;padding:12px 14px;background:rgba(232,184,106,.06);border:1px solid var(--amber2);color:var(--ink);font:inherit;font-size:14px;line-height:1.35;text-align:left;border-radius:8px;cursor:pointer}
.btn:active{background:rgba(232,184,106,.22)}
.btn.main{border-color:var(--amber);color:var(--amber)}
.row{display:flex;gap:8px;margin-top:6px}.row .btn{flex:1;text-align:center}
.h{font-size:17px;font-weight:600;margin-bottom:8px}
.sub{font-size:11px;color:var(--amber);letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.p{font-size:14px;line-height:1.55;margin-bottom:10px}
.note{font-size:12px;line-height:1.5;color:var(--dim);margin-bottom:8px}
.scroll{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin:8px 0 10px}
.deva{font-family:'Tiro Devanagari Sanskrit',serif;font-size:20px;line-height:1.5;color:var(--amber);overflow-wrap:anywhere}
.iast{font-style:italic;font-size:13px;color:var(--dim);margin:4px 0 8px;line-height:1.45}
.ru{font-size:15px;line-height:1.55}
.src{font-size:11px;color:var(--dim);margin-top:8px;letter-spacing:.03em}
.center{position:absolute;left:0;right:0;top:21%;text-align:center;text-shadow:0 0 14px #000,0 0 4px #000}
.big{font-size:30px;letter-spacing:.22em;padding-left:.22em;color:var(--amber)}
.mid{font-size:13px;margin-top:8px;letter-spacing:.06em}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);background:rgba(7,9,8,.96);border:1px solid var(--amber2);padding:8px 12px;border-radius:8px;font-size:12px;opacity:0;transition:opacity .4s;max-width:88vw;text-align:center}
.toast.on{opacity:1}
.title{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 7%);text-align:center;text-shadow:0 0 18px #000}
.om{font-family:'Tiro Devanagari Sanskrit',serif;font-size:54px;color:var(--amber);line-height:1}
.t1{font-size:25px;letter-spacing:.42em;padding-left:.42em;margin-top:10px}
.t2{font-size:10px;color:var(--dim);letter-spacing:.2em;margin-top:10px;text-transform:uppercase}
.q{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px;margin:6px 0 12px;align-items:baseline}
.q .bar{color:var(--amber);white-space:nowrap;font-size:12px}
.opts{display:flex;gap:6px;margin:6px 0 10px}
.opts button{flex:1;padding:9px 4px;background:none;border:1px solid var(--line);color:var(--ink);font:inherit;font-size:12px;border-radius:6px;cursor:pointer}
.opts button.on{border-color:var(--amber);color:var(--amber)}
.close{float:right;background:none;border:none;color:var(--dim);font:inherit;font-size:22px;line-height:1;padding:0 4px;cursor:pointer}
a{color:var(--amber)}
.hint{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);text-align:center;font-size:12px;line-height:1.45;text-shadow:0 0 10px #000,0 0 4px #000,0 0 2px #000}
.info{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);max-width:560px;margin:0 auto;background:rgba(7,9,8,.9);border:1px solid var(--amber2);border-radius:10px;padding:12px 14px}

<body>
<canvas id="cv"></canvas>
<div id="ui">
  <div id="hud" class="hud hidden">
    <div class="l"><button id="btnBack" class="hidden">◀ назад</button><button id="who"><span class="stage">Ищущий</span></button></div>
    <div class="r"><button id="btnScrolls">Свитки · 0</button><button id="btnTilt" class="off">наклон</button><button id="btnSound">звук</button></div>
  </div>

  <div id="center" class="center hidden"></div>
  <div id="hint" class="hint hidden"></div>
  <div id="info" class="info hidden"></div>
  <div id="panel" class="panel hidden"></div>

</div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function hash(x,y){let h=(x|0)*374761393+(y|0)*668265263;h=(h^(h>>>13))*1274126177;h=h^(h>>>16);return (h>>>0)/4294967296;}
const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const FAST=/[?&]fast/.test(location.search);
const STANDALONE=()=>{try{return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}catch(e){return false;}};

/* ---------- палитры и символы ---------- */
function hexRgb(h){const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255];}
function ramp(a,b,n=8){const A=hexRgb(a),B=hexRgb(b);return Array.from({length:n},(_,i)=>{const t=i/(n-1);return 'rgb('+A.map((v,k)=>Math.round(v+(B[k]-v)*t)).join(',')+')';});}
const PAL={
  grass:ramp('#0a160c','#6ea765'), water:ramp('#06121c','#6fb0d6'), sky:ramp('#0b0e13','#c9d3e4'),
  stone:ramp('#141311','#b3a88f'), skin:ramp('#2e2418','#fbefd6'), amber:ramp('#2a1b08','#f6c87c'), amberHi:ramp('#3a2810','#fff3d2'),
  snake:ramp('#111a09','#d4e086'), path:ramp('#1d1508','#c39350'), shade:ramp('#0f0f0d','#5d574b')
};
const RD=[' ','·','ः','ऽ','।','र','॥','म','ष','क्ष'];
const RS=[' ','·','ः','ऽ','व','स','श','ष','क्ष'];
const RDV=[' ','ः','ऽ','र','न','त','क','म','भ','ष','क्ष','ॐ'];RDV.big=true;
const RSV=[' ','ः','ऽ','व','स','श','ष','क्ष'];RSV.big=true;
const RIM=['·','·'];
const FIGK=1;
const RDW={word:['क','रु','णे','श्व','री']}; // слово, зашифрованное в фигуре: करुणेश्वरी
const LABX={pre:null,post:null};
const RG=[' ','·','ः','◦','○','△','▽','◇','▲','◆','●'];
const RGS=[' ','·','ः','◦','○','▽','◇','◆','●'];
/* воронка из знаков: рисуется под символьной сеткой */
const FUN={
  om:{g:['ॐ'],rgb:'232,184,106'},
  map:{g:['ॐ'],rgb:'232,184,106',a:0.45,slow:0.5},
  village:{g:['यम','नियम'],rgb:'232,184,106',a:0.7},
  tree:{g:['लं'],rgb:'200,160,90',slow:0.25,cy:0.46},
  tide:{g:['यं'],rgb:'130,190,235',cy:0.55},
  pond:{g:['·','◦','○'],rgb:'215,225,240',slow:0.4,a:0.8},
  snake:{g:['व','श','ष','स'],rgb:'170,210,120',cy:0.55}
};
const segG=(()=>{try{const sg=new Intl.Segmenter('hi',{granularity:'grapheme'});return s=>[...sg.segment(s)].map(q=>q.segment);}catch(e){return s=>s.split('');}})();
/* мандала из знаков: раскрывается кольцами, кольца вращаются в разные стороны */
function mandala(t,cfg){
  const cx=W/2,cy=(cfg.cy||0.4)*H,k=Math.min(W,H)/390,g=cfg.g,K=cfg.rings||8,P=cfg.petals||6,bloom=clamp(t/3,0,1),br=0.5+0.5*Math.sin(t*0.5),A=cfg.a||1;
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<K;i++){const open=clamp(bloom*K*1.3-i,0,1);if(open<=0)break;const e=1-Math.pow(1-open,3);
    const r0=(18+i*23)*k*e,n=8*(i+1),dir=i%2?1:-1,rot=t*0.1*dir/(1+i*0.3),fs=clamp((8+i*0.9)*k,7,15),fade=1-i/(K+2);
    ctx.font=fs.toFixed(1)+"px 'Tiro Devanagari Sanskrit', serif";
    for(let j=0;j<n;j++){const a=j/n*Math.PI*2+rot,w=0.5+0.5*Math.sin(a*P-t*0.6),r=r0*(1+0.1*w),X=cx+Math.cos(a)*r,Y=cy+Math.sin(a)*r;
      const al=(0.16+0.5*w*w)*e*fade*(0.8+0.2*br)*A;ctx.fillStyle='rgba('+cfg.rgb+','+al.toFixed(3)+')';ctx.fillText(g[(j+i)%g.length],X,Y);}
    // лепестковое кольцо между рядами
    const rp=r0+11*k*e,m=P*12;ctx.font=(6*k).toFixed(1)+"px 'IBM Plex Mono', monospace";
    for(let j=0;j<m;j++){const a=j/m*Math.PI*2-rot*0.5,w=Math.pow(0.5+0.5*Math.sin(a*P+t*0.4),3),r=rp*(1+0.16*w),X=cx+Math.cos(a)*r,Y=cy+Math.sin(a)*r;
      ctx.fillStyle='rgba('+cfg.rgb+','+((0.05+0.3*w)*e*fade*A).toFixed(3)+')';ctx.fillText('·',X,Y);}}
  
  ctx.textAlign='left';ctx.textBaseline='top';
}
function funnel(t,cfg){
  const cx=W/2,cy=(cfg.cy||0.5)*H,k=Math.min(W,H)/560,sh=((t*(cfg.slow||1))/5)%1,maxR=Math.hypot(W,H)*0.6,A=cfg.a||1;
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(let n=-2;n<32;n++){const u=n-sh,r=14*k*Math.exp(u*0.2);if(r<8)continue;if(r>maxR)break;const fs=clamp(r*0.115,4,34*k);ctx.font=fs.toFixed(1)+"px 'Tiro Devanagari Sanskrit', serif";const tw=u*0.16,dep=clamp((r-20*k)/(380*k),0,1);
    for(let q=0;q<36;q++){const a=q/36*Math.PI*2+tw,X=cx+Math.cos(a)*r,Y=cy+Math.sin(a)*r*1.15;if(X<-24||X>W+24||Y<-24||Y>H+24)continue;
      const arm=0.5+0.5*Math.sin(3*a-u*0.9),al=(0.018+0.17*Math.pow(arm,3))*Math.pow(dep,0.7)*A;if(al<0.01)continue;
      ctx.fillStyle='rgba('+cfg.rgb+','+al.toFixed(3)+')';ctx.fillText(cfg.g[(q+((n%3)+3)%3)%cfg.g.length],X,Y);}}
  const gr=ctx.createRadialGradient(cx,cy,40*k,cx,cy,330*k);gr.addColorStop(0,'rgba(5,7,6,.9)');gr.addColorStop(0.75,'rgba(5,7,6,.45)');gr.addColorStop(1,'rgba(5,7,6,0)');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  ctx.textAlign='left';ctx.textBaseline='top';
}
const GR=[',','\'','`','.',',','"',';'];

/* ---------- сетка символов ---------- */
const cv=$('#cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,FS=12,CW=7,CH=14,COLS=0,ROWS=0,MASK=new Uint8Array(0),FONT='12px monospace';
const BUF=new Map(),BUF2=new Map();
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
  FS=clamp(Math.round(W/105),3,10);FONT=FS+"px 'IBM Plex Mono', 'Tiro Devanagari Sanskrit', ui-monospace, Menlo, monospace";ctx.font=FONT;
  CW=ctx.measureText('M').width||FS*0.6;CH=Math.round(FS*1.22);
  COLS=Math.ceil(W/CW)+1;ROWS=Math.ceil(H/CH)+1;MASK=new Uint8Array(COLS*ROWS);
}
function putC(c,r,ch,col){if(c<0||r<0||c>=COLS||r>=ROWS)return;const i=r*COLS+c;if(MASK[i])return;MASK[i]=1;let a=BUF.get(col);if(!a){a=[];BUF.set(col,a);}a.push(c,r,ch);}
function putB(c,r,ch,col){if(c<0||r<0||c+1>=COLS||r>=ROWS)return;const i=r*COLS+c;if(MASK[i]||MASK[i+1])return;MASK[i]=MASK[i+1]=1;let a=BUF2.get(col);if(!a){a=[];BUF2.set(col,a);}a.push(c,r,ch);}
function mark(c,r){if(c<0||r<0||c>=COLS||r>=ROWS)return;MASK[r*COLS+c]=1;}
function flush(){ctx.font=FONT;ctx.textBaseline='top';ctx.textAlign='left';const oy=(CH-FS)/2;for(const [col,a] of BUF){if(!a.length)continue;ctx.fillStyle=col;for(let i=0;i<a.length;i+=3)ctx.fillText(a[i+2],a[i]*CW,a[i+1]*CH+oy);a.length=0;}
  ctx.font=(FS*1.5).toFixed(1)+"px 'Tiro Devanagari Sanskrit', serif";ctx.textAlign='center';ctx.textBaseline='middle';for(const [col,a] of BUF2){if(!a.length)continue;ctx.fillStyle=col;for(let i=0;i<a.length;i+=3)ctx.fillText(a[i+2],a[i]*CW+CW,a[i+1]*CH+CH*0.55);a.length=0;}ctx.textAlign='left';ctx.textBaseline='top';}
function eachCell(fn){for(let r=0;r<ROWS;r++){const o=r*COLS;for(let c=0;c<COLS;c++){if(!MASK[o+c])fn(c,r);}}}
const px2c=x=>Math.floor(x/CW), py2r=y=>Math.floor(y/CH);

/* ---------- фигуры из символов (SDF) ---------- */
function smin(a,b,k){const h=clamp(0.5+0.5*(b-a)/k,0,1);return lerp(b,a,h)-k*h*(1-h);}
function sdCap(x,y,ax,ay,bx,by,r){const pax=x-ax,pay=y-ay,bax=bx-ax,bay=by-ay;const h=clamp((pax*bax+pay*bay)/((bax*bax+bay*bay)||1e-9),0,1);const dx=pax-bax*h,dy=pay-bay*h;return Math.sqrt(dx*dx+dy*dy)-r;}
function mkFig(list,k=0.025){
  const s=list.map(q=>[q[0]==='c'?0:q[0]==='o'?1:2,...q.slice(1)]);let R=0;
  for(const q of s){if(q[0]===0)R=Math.max(R,Math.hypot(q[1],q[2])+q[5],Math.hypot(q[3],q[4])+q[5]);else if(q[0]===1)R=Math.max(R,Math.hypot(q[1],q[2])+q[3]);else R=Math.max(R,Math.hypot(q[1],q[2])+Math.max(q[3],q[4]));}
  return {s,R,k};
}
function sdf(f,x,y){let m=1e9;const s=f.s;for(let i=0;i<s.length;i++){const q=s[i];let d;
  if(q[0]===0)d=sdCap(x,y,q[1],q[2],q[3],q[4],q[5]);
  else if(q[0]===1){const dx=x-q[1],dy=y-q[2];d=Math.sqrt(dx*dx+dy*dy)-q[3];}
  else{const dx=(x-q[1])/q[3],dy=(y-q[2])/q[4];d=(Math.sqrt(dx*dx+dy*dy)-1)*Math.min(q[3],q[4]);}
  m=i?smin(m,d,f.k):d;}return m;}
let FRAME=0;
/* ---------- фигуры из знаков: запекаются один раз и кэшируются ---------- */
const SPRB=(()=>{

const W=390,H=844;let CS=2.75,COLS=0,ROWS=0,BR,MAT,GL,ctx,cv;
const RAMP=['·','ः','ऽ','।','र','॥','म','ष','क्ष'];
const MATS=[];
function mat(o){MATS.push(o);return MATS.length-1;}
// --- SDF ---
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
function cap(ax,ay,bx,by,ra,rb){return {t:'c',ax,ay,bx,by,ra,rb:rb==null?ra:rb};}
function ell(cx,cy,rx,ry,rot){return {t:'e',cx,cy,rx,ry,rot:rot||0};}
function rock(cx,cy,rx,ry,sd,rot,amp){return {t:'r',cx,cy,rx,ry,sd:sd||1,rot:rot||0,amp:amp};}
function box(cx,cy,hw,hh,r){return {t:'b',cx,cy,hw,hh,r:r||0};}
function prim(p,x,y){
  if(p.t==='c'){const dx=p.bx-p.ax,dy=p.by-p.ay,l2=dx*dx+dy*dy||1;let t=((x-p.ax)*dx+(y-p.ay)*dy)/l2;t=clamp(t,0,1);return Math.hypot(x-p.ax-dx*t,y-p.ay-dy*t)-lerp(p.ra,p.rb,t);}
  if(p.t==='e'){let X=x-p.cx,Y=y-p.cy;if(p.rot){const c=Math.cos(-p.rot),s=Math.sin(-p.rot);[X,Y]=[X*c-Y*s,X*s+Y*c];}const k=Math.hypot(X/p.rx,Y/p.ry);return (k-1)*Math.min(p.rx,p.ry);}
  if(p.t==='r'){let X=x-p.cx,Y=y-p.cy;if(p.rot){const c=Math.cos(-p.rot),s2=Math.sin(-p.rot);[X,Y]=[X*c-Y*s2,X*s2+Y*c];}const a=Math.atan2(Y/p.ry,X/p.rx);const k=Math.hypot(X/p.rx,Y/p.ry);const A=p.amp||0.12;const m=1+A*(vnoise(Math.cos(a)*1.3+p.sd,Math.sin(a)*1.3+p.sd)-0.5)*2+A*0.35*Math.sin(a*2+p.sd)+A*0.25*Math.sin(a*5+p.sd*2);return (k-m)*Math.min(p.rx,p.ry);}
  if(p.t==='b'){const qx=Math.abs(x-p.cx)-p.hw+p.r,qy=Math.abs(y-p.cy)-p.hh+p.r;return Math.hypot(Math.max(qx,0),Math.max(qy,0))+Math.min(Math.max(qx,qy),0)-p.r;}
}
function smin(a,b,k){if(k<=0)return Math.min(a,b);const h=clamp(0.5+0.5*(b-a)/k,0,1);return lerp(b,a,h)-k*h*(1-h);}
function bodySdf(B,x,y){let d=1e9;for(const p of B.prims)d=smin(d,prim(p,x,y),B.k||0);if(B.cut)for(const p of B.cut)d=Math.max(d,-prim(p,x,y));return d;}
function bbox(B){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const p of B.prims){let a,b,c,d;if(p.t==='c'){const r=Math.max(p.ra,p.rb);a=Math.min(p.ax,p.bx)-r;c=Math.max(p.ax,p.bx)+r;b=Math.min(p.ay,p.by)-r;d=Math.max(p.ay,p.by)+r;}else if(p.t==='e'||p.t==='r'){const r=Math.max(p.rx,p.ry);a=p.cx-r;c=p.cx+r;b=p.cy-r;d=p.cy+r;}else{a=p.cx-p.hw;c=p.cx+p.hw;b=p.cy-p.hh;d=p.cy+p.hh;}x0=Math.min(x0,a);y0=Math.min(y0,b);x1=Math.max(x1,c);y1=Math.max(y1,d);}return [x0-4,y0-4,x1+4,y1+4];}
// --- шум ---
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))*1274126177|0;return ((h^(h>>>16))>>>0)/4294967295;}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);return lerp(lerp(hash(xi,yi),hash(xi+1,yi),u),lerp(hash(xi,yi+1),hash(xi+1,yi+1),u),v);}
function fbm(x,y){return 0.5*vnoise(x,y)+0.25*vnoise(x*2.1,y*2.1)+0.125*vnoise(x*4.3,y*4.3)+0.0625*vnoise(x*8.7,y*8.7);}
let SEED=7;function rnd(){SEED=(SEED*16807)%2147483647;return SEED/2147483647;}
// --- растеризация тела ---
// opt: {m: материал, light:[lx,ly], amb, emit(x,y)->доп.яркость, pat(x,y,d,b)->b, glow:true}
function paint(B,opt){
  const [x0,y0,x1,y1]=bbox(B);const c0=Math.max(0,Math.floor(x0/CS)),c1=Math.min(COLS-1,Math.ceil(x1/CS)),r0=Math.max(0,Math.floor(y0/CS)),r1=Math.min(ROWS-1,Math.ceil(y1/CS));
  const L=opt.light||[-0.45,-0.75],ll=Math.hypot(L[0],L[1]);const e=0.8,rim=opt.rim==null?CS*1.2:opt.rim;
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){const x=c*CS+CS/2,y=r*CS+CS/2;const d=bodySdf(B,x,y);
    if(d>CS*2)continue;const i=r*COLS+c;
    if(d>0){ if(opt.gap&&MAT[i]>=0&&!opt.over){MAT[i]=-1;BR[i]=0;} continue;}
    const gx=bodySdf(B,x+e,y)-bodySdf(B,x-e,y),gy=bodySdf(B,x,y+e)-bodySdf(B,x,y-e),gl=Math.hypot(gx,gy)||1;
    let ndl=-(gx*L[0]+gy*L[1])/(gl*ll);if(B.prims.every(q=>q.t==='b')&&d<-CS*2)ndl=0.35;
    const allBox=B.prims.every(q=>q.t==='b');const depth=Math.sqrt(clamp(-d/(allBox?3:(opt.depth||18)),0,1));
    let b=(opt.amb==null?0.18:opt.amb)+(opt.kd==null?0.35:opt.kd)*depth+(opt.kl==null?0.45:opt.kl)*Math.max(0,ndl);
    if(d>-rim)b=Math.max(b,opt.rimB==null?0.55:opt.rimB);
    if(opt.emit)b+=opt.emit(x,y);
    if(opt.pat)b=opt.pat(x,y,d,b);
    b=clamp(b,0,1);b=b<0.5?0.5*Math.pow(2*b,1.3):1-0.5*Math.pow(2-2*b,1.3);b=clamp(b+(hash(c,r)-0.5)*0.05,0,1);
    MAT[i]=opt.m;BR[i]=b;GL[i]=opt.glow?1:0;}
}
function dot(x,y,b,m,g){const c=Math.floor(x/CS),r=Math.floor(y/CS);if(c<0||r<0||c>=COLS||r>=ROWS)return;const i=r*COLS+c;MAT[i]=m;BR[i]=b;GL[i]=g?1:0;}
function curve(pts,m,b,g,step){for(let k=0;k<pts.length-1;k++){const [ax,ay]=pts[k],[bx,by]=pts[k+1];const n=Math.ceil(Math.hypot(bx-ax,by-ay)/(step||CS));for(let j=0;j<=n;j++)dot(lerp(ax,bx,j/n),lerp(ay,by,j/n),typeof b==='function'?b(k,j):b,m,g);}}
// --- палитры ---
function pal(stops){return b=>{const t=clamp(b,0,1)*(stops.length-1),i=Math.floor(t),f=t-i,a=stops[i],c=stops[Math.min(i+1,stops.length-1)];return 'rgb('+Math.round(lerp(a[0],c[0],f))+','+Math.round(lerp(a[1],c[1],f))+','+Math.round(lerp(a[2],c[2],f))+')';};}

// --- фон ---
function stars(n,col,seed){return;SEED=seed||11;const m=mat({pal:col||GOLD});for(let i=0;i<n;i++){const x=rnd()*W,y=rnd()*H,b=rnd();dot(x,y,0.15+0.5*b*b,m,b>0.9);if(b>0.97){for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]])dot(x+dx*CS,y+dy*CS,0.4,m,true);}}}
function field(x0,y0,x1,y1,palf,fn){return;const m=mat({pal:palf});for(let r=Math.floor(y0/CS);r<Math.min(ROWS,y1/CS);r++)for(let c=Math.floor(x0/CS);c<Math.min(COLS,x1/CS);c++){const x=c*CS,y=r*CS;const b=fn(x,y,c,r);if(b==null||b<=0)continue;const i=r*COLS+c;if(MAT[i]>=0)continue;MAT[i]=m;BR[i]=b;}}
// --- финальный рендер ---
function render(glow){
  ctx.font=(CS*1.25).toFixed(2)+"px 'Tiro Devanagari Sanskrit', serif";ctx.textAlign='center';ctx.textBaseline='middle';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const i=r*COLS+c,m=MAT[i];if(m<0)continue;const b=BR[i];
    ctx.fillStyle=MATS[m].pal(b);ctx.fillText(RAMP[Math.min(RAMP.length-1,Math.floor(b*RAMP.length))],c*CS+CS/2,r*CS+CS/2);}
  if(glow){const sw=Math.max(1,cv.width>>3),sh=Math.max(1,cv.height>>3),t=document.createElement('canvas');t.width=sw;t.height=sh;const tc=t.getContext('2d');tc.drawImage(cv,0,0,sw,sh);
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=Math.min(1,glow.a*2.2);ctx.drawImage(t,0,0,W,H);ctx.restore();}
}
function radial(x,y,r,col,a){ctx.save();ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba('+col+','+a+')');g.addColorStop(1,'rgba('+col+',0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r);ctx.restore();}

// человеческая фигура по анатомическим линиям (стоящая, лёгкий контрапост)
function humanStanding(cx,base,h,opt){opt=opt||{};const s=h/600;const X=v=>cx+v*s,Y=v=>base-v*s;const P=[];
  P.push(ell(X(0),Y(545),26,32));P.push(ell(X(-2),Y(590),17,20));            // голова, пучок
  P.push(cap(X(0),Y(510),X(0),Y(492),11,12));                                 // шея
  P.push(ell(X(0),Y(470),56,18));                                             // плечевой пояс
  P.push(cap(X(0),Y(470),X(4),Y(380),40,30));                                 // грудная клетка -> талия
  P.push(ell(X(10),Y(330),46,40));                                            // таз (сдвинут)
  // ноги: опорная прямая, другая чуть согнута
  P.push(cap(X(-20),Y(320),X(-22),Y(175),25,16));P.push(cap(X(-22),Y(175),X(-26),Y(30),15,9));P.push(ell(X(-24),Y(10),18,9));
  P.push(cap(X(32),Y(318),X(30),Y(178),24,15));P.push(cap(X(30),Y(178),X(10),Y(32),14,9));P.push(ell(X(6),Y(10),18,9));
  const arms=opt.arms||'down';
  if(arms==='down'){P.push(cap(X(-50),Y(468),X(-62),Y(370),13,10));P.push(cap(X(-62),Y(370),X(-66),Y(280),10,7));P.push(ell(X(-67),Y(266),8,13));
    P.push(cap(X(50),Y(468),X(66),Y(372),13,10));P.push(cap(X(66),Y(372),X(78),Y(290),10,7));P.push(ell(X(80),Y(276),8,13));}
  if(arms==='pot'){P.push(cap(X(-50),Y(468),X(-62),Y(370),13,10));P.push(cap(X(-62),Y(370),X(-66),Y(280),10,7));P.push(ell(X(-67),Y(266),8,13));
    P.push(cap(X(50),Y(468),X(72),Y(390),13,10));P.push(cap(X(72),Y(390),X(52),Y(330),10,8));}
  return {prims:P.map(p=>{if(p.t==='c'){p.ra*=s;p.rb*=s;}else if(p.t==='e'){p.rx*=s;p.ry*=s;}return p;}),k:18*s};}

    ell(cx,532,28,10),
    ell(cx,566,148,29),ell(cx-112,560,45,25),ell(cx+112,560,45,25),
    cap(cx-120,572,cx+40,548,19,14),cap(cx+120,572,cx-40,548,19,14)],k:14};
  const m1=mat({pal:GOLD});
  const teardrop=(x,yb,w,h,b)=>{const P=[];for(let i=0;i<=360;i++){const u=i/360;const ang=u*Math.PI*2;const yy=0.5-0.5*Math.cos(ang);const half=w*Math.sin(Math.PI*Math.pow(yy,0.62));P.push([x+(u<0.5?half:-half),yb-h+h*yy]);}curve(P,m1,b,true,CS*0.8);};

  for(let r=Math.floor(560/CS);r<ROWS;r++)for(let c=0;c<COLS;c++){const i=r*COLS+c;if(MAT[i]===m1)MAT[i]=-1;}
  if(!plain)curve([[cx,80],[cx,192]],m1,0.45,true);
  if(!plain){
  // лотос: веер заострённых лепестков под фигурой

  const petal=(px,py,ang,len,wid,b)=>{const P=[];for(let i=0;i<=60;i++){const t=i/60*Math.PI*2;const yy=0.5-0.5*Math.cos(t);const half=wid*Math.sin(Math.PI*Math.pow(yy,0.7));const lx=(t<Math.PI?half:-half),ly=-len*yy;const c=Math.cos(ang),s2=Math.sin(ang);P.push([px+lx*c-ly*s2,py+lx*s2+ly*c]);}curve(P,ml,b,false,CS*0.8);};

  for(let k=-4;k<=4;k++){petal(cx+k*34,642,k*0.14,48,15,0.4);}
  curve([[cx-185,644],[cx+185,644]],ml,0.3,false);
  }

  branch(198,402,-Math.PI/2-0.75,58,10,6);branch(198,402,-Math.PI/2+0.75,58,10,6);branch(196,404,-Math.PI/2,52,9,6);branch(194,430,-Math.PI/2-1.25,46,7,5);branch(198,428,-Math.PI/2+1.2,48,7,5);

    let near=1e9;for(let k=0;k<tips.length;k+=1){const t=tips[k];const dd=(t[0]-x)**2+(t[1]-y)**2;if(dd<near)near=dd;}

let last=performance.now(),TT=0,SKIP=2,RAVG=8;
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;TT+=dt;FRAME++;
  if(scene&&scene.update)scene.update(dt,TT);
  if(FRAME%SKIP===0){const t0=performance.now();ctx.clearRect(0,0,W,H);MASK.fill(0);if(LABX.pre)LABX.pre(TT);if(scene&&scene.render)scene.render(TT);flush();if(scene&&scene.post)scene.post(TT);if(LABX.post)LABX.post(TT);
    RAVG=RAVG*0.95+(performance.now()-t0)*0.05;SKIP=RAVG>24?4:RAVG>15?3:2;}
  requestAnimationFrame(loop);
}

/* --- визуальная новелла --- */
let vnAdv=null;
function vn(lines,done){
  let i=0,typing=null,full='';
  function finishType(){if(typing){clearInterval(typing);typing=null;const el=$('#vtxt');if(el)el.textContent=full;const ch=$('#vch');if(ch)ch.classList.remove('hidden');return true;}return false;}
  function next(){
    if(i>=lines.length){vnAdv=null;hidePanel();if(done)done();return;}
    const L=lines[i++];if(L.fn)L.fn();
    if(L.scroll){vnAdv=null;const isNew=gain(L.scroll);tick(660);panel('<div class="sub">'+(isNew?'Новый свиток':'Свиток')+'</div>'+scrollHTML(L.scroll)+'<p class="note">Свиток добавлен в библиотеку.</p><button class="btn main" data-a="ok">Дальше</button>',{ok:next});return;}
    if(!L.text){next();return;}
    full=L.text;
    const chs=L.choice?'<div class="hidden" id="vch">'+L.choice.map((c,k)=>'<button class="btn" data-k="'+k+'">'+c.t+'</button>').join('')+'</div>':'<div class="tap">коснись, чтобы продолжить ▸</div>';
    P.innerHTML='<div class="card"><div class="who">'+(L.who||'&nbsp;')+(L.tag?'<span class="tag">· '+L.tag+'</span>':'')+'</div><div class="txt" id="vtxt"></div>'+chs+'</div>';P.classList.remove('hidden');
    const el=$('#vtxt');let n=0;typing=setInterval(()=>{n+=2;el.textContent=full.slice(0,n);if(n>=full.length)finishType();},30);
    P.onclick=e=>{const b=e.target.closest('[data-k]');if(finishType())return;
      if(L.choice){if(!b)return;const c=L.choice[+b.dataset.k];if(L.pick)L.pick(c);if(c.reply)lines.splice(i,0,{who:c.rwho||L.who,text:c.reply});if(c.cut)lines.length=i+(c.reply?1:0);next();}else next();};
    vnAdv=L.choice?()=>{finishType();}:()=>{if(!finishType())next();};
  }
  next();
}

function seatLotus(ox,oy,S){S*=FIGK;const w=LOTUS[0].length,c0=px2c(ox)-Math.floor(w/2),r0=py2r(oy+0.06*S);LOTUS.forEach((ln,i)=>{for(let j=0;j<ln.length;j++){const q=ln[j];if(q!==' ')putC(c0+j,r0+i,q,q==='ॐ'?PAL.amberHi[7]:PAL.amber[6]);}});}
function omRing(ox,oy,S,t){S*=FIGK;ctx.save();ctx.font="13px 'Tiro Devanagari Sanskrit', serif";ctx.fillStyle='rgba(232,184,106,.35)';ctx.textAlign='center';ctx.textBaseline='middle';const n=12,cy=oy-0.3*S,r=S*0.58;for(let i=0;i<n;i++){const a=-t*0.08+i/n*Math.PI*2,x=ox+Math.cos(a)*r,y=cy+Math.sin(a)*r*1.2;ctx.save();ctx.translate(x,y);ctx.rotate(a+Math.PI/2);ctx.fillText('ॐ',0,0);ctx.restore();}ctx.restore();}

/* --- дыхательное ядро --- */
const PATS=[{n:'Ровное дыхание',i:4,o:4,c:6},{n:'Длинный выдох',i:4,o:6,c:5},{n:'С задержкой',i:4,h:4,o:6,c:4}];
function breathCore(p){const h=p.h||0;return {p,t:0,started:false,lvl:0,guide:0,match:0,total:0,done:false,phase:'in',lastPhase:'in',cyc:0,ok:false,remain:p.i,
  step(dt,hold){if(this.done)return;if(!this.started){if(hold){this.started=true;tick(520);}else return;}
    this.t+=dt;const L=this.p.i+h+this.p.o,k=Math.floor(this.t/L),ph=this.t-k*L,inPh=ph<this.p.i,hPh=!inPh&&ph<this.p.i+h;
    if(k>=this.p.c){this.done=true;return;}
    this.phase=inPh?'in':hPh?'hold':'out';if(this.phase!==this.lastPhase){this.lastPhase=this.phase;tick(inPh?520:hPh?460:390);vib(12);}
    this.cyc=k;this.guide=inPh?0.5-0.5*Math.cos(Math.PI*ph/this.p.i):hPh?1:0.5+0.5*Math.cos(Math.PI*(ph-this.p.i-h)/this.p.o);
    this.lvl=clamp(this.lvl+(hold?(inPh||hPh?dt/this.p.i:dt/this.p.i*0.3):-dt/this.p.o),0,1);
    const nb=Math.min(ph,Math.abs(ph-this.p.i),Math.abs(ph-this.p.i-h),L-ph);this.ok=(hold===(inPh||hPh))||nb<0.35;this.total+=dt;if(this.ok)this.match+=dt;
    this.remain=inPh?this.p.i-ph:hPh?this.p.i+h-ph:L-ph;},
  score(){return this.total?this.match/this.total:0;}};}

/* --- асана: врикшасана --- */
function makeTree(side){
  const live=sensorsLive(),dur=FAST?5:30;
  let st='count',tt=0,n0=0,ang=0,dev=0,prev=0,sumS=0,sumD=0,dBase=0,dCur=0,lastSec=-1;const g0={x:0,y:0,z:0};
  const ph=[Math.random()*6,Math.random()*6,Math.random()*6];
  return {name:'tree',back:()=>sceneMap,
    enter(){$('#hud').classList.remove('hidden');hint(live?'Встань в позу, телефон в ладонях у груди':'Коснись экрана и веди пальцем, чтобы удерживать фигуру');},
    up(){dBase=dCur;},
    update(dt){tt+=dt;
      if(st==='count'){const s=Math.max(1,(FAST?2:5)-Math.floor(tt));if(s!==lastSec){lastSec=s;center('<div class="big">'+s+'</div><div class="mid">'+(side?'другая нога — опора':'левая нога — опора')+'</div>');tick(440);}if(tt>=(FAST?2:5)){st='calib';tt=0;lastSec=-1;if(live)center('<div class="big">···</div><div class="mid">замри</div>');}return;}
      if(st==='calib'){if(live){g0.x+=M.gs.x;g0.y+=M.gs.y;g0.z+=M.gs.z;n0++;}if(tt>(live?1.2:0.1)){if(n0){g0.x/=n0;g0.y/=n0;g0.z/=n0;}st='run';tt=0;tick(660);center();hint(live?'Дыши ровно. Взгляд в одну точку.':'Ветер качает дерево — веди пальцем против ветра');}return;}
      if(st!=='run')return;
      if(live){const r=tiltFromBase(g0);dev=r.dev;ang=clamp(r.lat*1.6,-40,40);}
      else{const w=0.55*Math.sin(tt*0.7+ph[0])+0.3*Math.sin(tt*1.9+ph[1])+0.15*Math.sin(tt*3.3+ph[2]);dCur=PT.down?dBase+(PT.x-PT.sx)/W*80:dBase;ang=clamp(w*16*(1+tt/40)+dCur,-40,40);dev=Math.abs(ang)/1.6;}
      sumS+=clamp(1-dev/10,0,1)*dt;sumD+=Math.abs(dev-prev);prev=dev;
      const left=Math.ceil(dur-tt);if(left!==lastSec){lastSec=left;center('<div class="mid" style="font-size:15px">0:'+String(Math.max(0,left)).padStart(2,'0')+'</div>');}
      if(tt>=dur){st='done';center();hint();S.sec+=dur;
        const sth=clamp(sumS/dur,0,1),suk=clamp(1-(sumD/dur)/(live?12:20),0,1);
        addQ('sthira',2+sth*12);addQ('sukha',1+suk*10);S.done.tree=true;
        result({title:'Врикшасана · результат',bars:[['Стхира · устойчивость',sth],['Сукха · лёгкость',suk]],
          msg:sth>0.75?'Корни держат. Это и есть стхира — устойчивость.':sth>0.45?'Дерево качается на ветру — и всё равно стоит. Так и должно быть.':'Ветер сегодня сильный. Попробуй мягче: стопа плотнее, взгляд в одну точку.',
          scrolls:['ys2_46'],againLabel:side?'Ещё раз':'Другая нога',again:()=>makeTree(side?0:1)});}
    },
    render(t){
      const ox=W/2,oy=H*0.84,Sc=Math.min(H*0.62,W*1.25),inZ=dev<5;
      drawFig(FIG_TREE,ox,oy,Sc,ang*Math.PI/180,inZ?PAL.skin:PAL.stone,RD);
      const fc=px2c(ox);
      for(let r=py2r(oy-Sc*1.02);r<py2r(oy);r++){const yy=(oy-(r*CH+CH/2))/Sc;const half=Math.tan(8*Math.PI/180)*yy*Sc/CW+0.32*Sc/CW;if(r%2)continue;for(const s of [-1,1])putC(Math.round(fc+s*half),r,'·',PAL.amber[inZ?6:3]);}
      const gr=py2r(oy)+1;for(let c=0;c<COLS;c++)putC(c,gr,c%2?'_':'.',PAL.stone[3]);
      landscape(t,{stars:0.3,grass:Math.min(0.99,oy/H+0.02)});
    }
  };
}

/* --- пранаяма: прилив --- */
function makeTide(pi){
  const p=Object.assign({},PATS[pi]);if(FAST)p.c=1;const B=breathCore(p);let shown='';
  return {name:'tide',back:()=>sceneMap,
    enter(){$('#hud').classList.remove('hidden');center('<div class="big">КОСНИСЬ</div><div class="mid">и держи — первый вдох</div>');hint(p.n+': вдох '+p.i+(p.h?' · задержка '+p.h:'')+' · выдох '+p.o+' · циклов: '+p.c);},
    update(dt){if(B.done)return;B.step(dt,holding());
      if(B.started&&!B.done){const s=Math.ceil(B.remain),key=B.phase+s+'|'+B.cyc;if(key!==shown){shown=key;center('<div class="big">'+(B.phase==='in'?'ВДОХ':B.phase==='hold'?'ЗАДЕРЖКА':'ВЫДОХ')+'</div><div class="mid">'+s+' · цикл '+(B.cyc+1)+' из '+p.c+'</div>');}}

/* --- медитация: тихая заводь --- */
function makePond(dur){
  if(FAST)dur=9;const live=sensorsLive();let A=0.7,still=0,tt=0,wl=null,lastSec=-1,ended=false;
  const top=0.22,bot=0.88,N=Math.round(clamp(COLS*ROWS/22,90,340));
  const pts=Array.from({length:N},()=>({x:Math.random()*W,y:lerp(top+0.04,bot,Math.random())*H,vx:0,vy:0,ch:".:*+o,'"[(Math.random()*7)|0],b:Math.random()}));
  return {name:'pond',back:()=>sceneMap,
    enter(){$('#hud').classList.remove('hidden');center('<div class="mid" style="font-size:14px">Закрой глаза.<br>Колокольчик позовёт.</div>');hint('');
      try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>wl=w).catch(()=>{});}catch(e){}},
    leave(){try{wl&&wl.release();}catch(e){}},
    down(){A=Math.min(1,A+0.5);},move(){if(PT.down)A=Math.min(1,A+0.02);},
    update(dt){if(ended)return;tt+=dt;
      if(live&&sensorsLive()&&M.jolt>0.35){A=Math.min(1,A+(M.jolt-0.35)*dt*4);}M.jolt*=0.9;
      A=Math.max(0,A-dt*0.14);if(A<0.2)still+=dt;
      if(tt>6&&tt<7)center();
      const left=Math.ceil(dur-tt);if(left!==lastSec){lastSec=left;hint('<span style="color:var(--dim)">'+Math.floor(left/60)+':'+String(left%60).padStart(2,'0')+'</span>');}
      const by=bot*H;
      for(const q of pts){const sink=24*(1-A);q.vx+=(Math.random()-0.5)*A*320*dt;q.vy+=(Math.random()-0.5)*A*320*dt-A*26*dt;q.vx*=0.95;q.vy*=0.95;q.x+=q.vx*dt;q.y+=(q.vy+sink)*dt;
        if(q.x<0)q.x+=W;if(q.x>W)q.x-=W;if(q.y<(top+0.03)*H)q.y=(top+0.03)*H;const fl=by-q.b*CH*1.6;if(q.y>fl){q.y=fl;q.vy=A>0.4?-Math.random()*90*A:0;}}
      if(tt>=dur){ended=true;hint();center();S.sec+=dur;const sc=clamp(still/Math.max(1,dur-5),0,1);addQ('dharana',2+sc*14);S.done.pond=true;
        result({title:'Медитация · результат',bars:[['Дхарана · время в тишине',sc]],
          msg:sc>0.7?'Муть осела. В неподвижной воде видно луну.':'Вода ещё мутная — и это нормально. Сидеть рядом с мутью тоже практика.',
          scrolls:['bg2_58'],again:()=>makePond(dur)});}},
    render(t){
      const by=bot*H;let settled=0;
      for(const q of pts){if(q.y>=by-q.b*CH*1.6-1)settled++;putC(px2c(q.x),py2r(q.y),q.ch,PAL.path[3+Math.round(q.b*4)]);}
      const clar=settled/pts.length;
      if(clar>0.7&&A<0.25){const mc=px2c(W/2),mr=py2r(H*0.42),al=clamp((clar-0.7)*3.3,0,1);
        ['  .--.','.(    )',"  `--'"].forEach((s,i)=>{for(let j=0;j<s.length;j++)if(s[j]!==' ')putC(mc+j-3,mr+i,s[j],PAL.sky[Math.round(2+al*5)]);});
        for(let j=-8;j<=8;j++)if(j%2===0)putC(mc+j,mr+4,'~',PAL.water[Math.round(3+al*3)]);}
      const sr=py2r(top*H),br=py2r(by);
      eachCell((c,r)=>{if(r===sr){const s=Math.sin(c*0.4-t*(0.6+A*2));putC(c,r,s>0?'~':'-',PAL.water[5+Math.round(A*2)]);}
        else if(r>sr){if(r>=br){if(hash(c,r)<0.6)putC(c,r,hash(r,c)<0.5?'_':'.',PAL.stone[3]);}
          else if(hash(c,r+((t*(0.4+A*3))|0))<0.07+A*0.07)putC(c,r,hash(r,c)<0.5?'~':'-',PAL.water[2+Math.round(A*3)]);}
        else bgStars(c,r,t);});
    }
  };
}

    for(const g of GROUPS){const d=groupDone(g),lk=g.from===5&&k<5,yy=g.y*H-Math.min(W,H)*0.34;ctx.fillStyle='rgba(5,7,6,.8)';ctx.fillRect(W/2-90,yy,180,30);
      ctx.fillStyle=d>=5?'#c9d3e4':lk?'#77736a':'#e8b86a';ctx.fillText(g.n.toUpperCase()+' · '+d+'/5',W/2,yy+2);ctx.font="11px 'IBM Plex Mono', monospace";ctx.fillStyle='#b3a88f';ctx.fillText(g.d,W/2,yy+16);ctx.font="500 12px 'IBM Plex Mono', monospace";}
    ctx.fillStyle='#8d8676';ctx.font="11px 'IBM Plex Mono', monospace";ctx.fillText('▲ на карту',W/2,H*0.05+12);}
};
function makeHouse(k){
  const Hh=HOUSES[k],grp=GROUPS[k<5?0:1],lastInGroup=k%5===4;let st='vn',mech=null,failed=false;
  const lines=()=>{const L=[];Hh.intro.forEach((t,i)=>L.push({who:Hh.n+' — '+Hh.ru,tag:grp.n+' · '+(k%5+1)+' из 5',text:t,fn:()=>{ISTG.s=i;}}));
    L.push({who:'',text:Hh.q,fn:()=>{ISTG.s='q';},choice:Hh.opts.slice().sort(()=>Math.random()-0.5).map(o=>o.ok?{t:o.t,ok:true,reply:o.reply,rwho:o.rwho,cut:true}:{t:o.t,reply:o.reply,cut:true}),pick:c=>{failed=!c.ok;ISTG.s=c.ok?'ok':'bad';}});return L;};
  const finish=()=>{st='done';center();hint();S.houses[Hh.id]=true;addQ('shraddha',4);addQ(k<5?'sukha':'dharana',3);S.sec+=20;
    const extra=Hh.after&&S.img?'<p class="note">Выбранный образ: '+Hh.after.opts.find(o=>o.v===S.img).t.toLowerCase()+'.</p>':'';
    const sc=gain(Hh.scroll);save();hud();bell();vib([30,50,30]);
    if(lastInGroup){const g2=gain(grp.scroll);panel('<div class="sub">'+grp.n+' · пройдена</div><div class="who">Наставница</div><p class="p">'+Hh.end+'</p><p class="p">'+grp.sum+'</p>'+extra+(sc?'<div class="sub" style="margin-top:14px">Новый свиток</div>'+scrollHTML(Hh.scroll):'')+(g2?scrollHTML(grp.scroll):'')+'<button class="btn main" data-a="v">'+(housesDone()>=10?'На карту':'В деревню')+'</button>',{v:()=>go(housesDone()>=10?sceneMap:sceneVillage)});}
    else panel('<div class="sub">'+Hh.n+' · пройдено</div><div class="who">Наставница</div><p class="p">'+Hh.end+'</p>'+extra+(sc?'<div class="sub" style="margin-top:14px">Новый свиток</div>'+scrollHTML(Hh.scroll):'')+'<div class="row"><button class="btn" data-a="v">В деревню</button><button class="btn main" data-a="n">Следующий дом</button></div>',{v:()=>go(sceneVillage),n:()=>go(makeHouse(k+1))});};
  const afterChoice=()=>{if(!Hh.after){finish();return;}st='vn';vn([{who:'',text:Hh.after.q,choice:Hh.after.opts.map(o=>({t:o.t,v:o.v})),pick:c=>{S.img=c.v;save();}}],finish);};
  const startMech=()=>{if(!Hh.mech){afterChoice();return;}st='mech';mech=Hh.mech();hint(Hh.task);if(mech.enter)mech.enter();};
  const onVnDone=()=>{if(failed){const used=FAILSEEN[Hh.id]||(FAILSEEN[Hh.id]=[]);let pool=Hh.fail.map((_,i)=>i).filter(i=>!used.includes(i));if(!pool.length){used.length=0;pool=Hh.fail.map((_,i)=>i);}const fi=pool[(Math.random()*pool.length)|0];used.push(fi);const first=!S.scrolls.includes('ys2_33');
    panel('<div class="who">Наставница</div><p class="p">'+Hh.fail[fi]+'</p>'+(first?'<p class="note">Когда мешают неблагие мысли, взращивай противоположное.</p>'+scrollHTML('ys2_33'):'')+'<button class="btn main" data-a="r">Заново</button>',{r:()=>{gain('ys2_33');go(makeHouse(k));}});return;}startMech();};
  let t0=null;const G=segG(Hh.deva).filter(c=>c.trim());
  return {name:'house',back:()=>sceneVillage,get mech(){return mech;},
    enter(){$('#hud').classList.remove('hidden');vn(lines(),onVnDone);},
    down(e){if(st==='mech'&&mech&&mech.down)mech.down(e);},
    move(e){if(st==='mech'&&mech&&mech.move)mech.move(e);},
    up(e){if(st==='vn'){if(vnAdv)vnAdv();return;}if(st==='mech'&&mech&&mech.up)mech.up(e);},
    update(dt){if(st!=='mech'||!mech)return;mech.update(dt);if(mech.done){mech=Object.assign(mech,{update(){}});setTimeout(()=>{afterChoice();},600);st='wait';}},
    render(t){if(t0===null)t0=t;if(mech){mech.render(t);}
      else{mandala(t-t0,{g:G,rgb:Hh.rgb,petals:Hh.petals,cy:0.42,core:G[0],a:0.2,rings:8});ILL[Hh.id](t,ISTG.s);}}
  };
}

window.__game={get houses(){return HOUSES;},lab:{LABX,RDW,RIM,mandala,drawFig,mkFig,putC,putB,mark,PAL,landscape,px2c,py2r,get W(){return W;},get H(){return H;},get CW(){return CW;},get CH(){return CH;},get COLS(){return COLS;},get ROWS(){return ROWS;},get ctx(){return ctx;},FIG_SEAT,FIG_TREE,FIG_GATE,FIG_HOUSE,ICON,NODES,RD,RS,hash,lerp,clamp,bgStars,eachCell},show(fn){go({name:'lab',render:fn,post:fn.post});},go,get S(){return S;},get scene(){return scene;},scenes:{sceneMap,sceneTitle,sceneVillage},makeTree,makeTide,makePond,makeSnake,makeChakra,makeHouse};
